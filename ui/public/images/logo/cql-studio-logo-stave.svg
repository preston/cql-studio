<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600" role="img" aria-labelledby="title desc">
  <!-- Author: Preston Lee -->
  <title id="title">CQL Studio stave lockup</title>
  <desc id="desc">Three black stave groups whose line lengths and note positions read as CQL.</desc>

  <!-- C: circular left edge with an open right side -->
  <g stroke="#000" stroke-width="32" stroke-linecap="round" fill="none">
    <path d="M220 470h260"/>
    <path d="M120 635h200"/>
    <path d="M85 800h200"/>
    <path d="M120 965h200"/>
    <path d="M220 1130h260"/>
  </g>
  <g fill="#000">
    <circle cx="480" cy="470" r="48"/>
    <circle cx="320" cy="635" r="48"/>
    <circle cx="285" cy="800" r="48"/>
    <circle cx="320" cy="965" r="48"/>
    <circle cx="480" cy="1130" r="48"/>
  </g>

  <!-- Q: rounded body with a lower-right tail -->
  <g stroke="#000" stroke-width="32" stroke-linecap="round" fill="none">
    <path d="M660 470h350"/>
    <path d="M540 635h510"/>
    <path d="M500 800h580"/>
    <path d="M540 965h410l80 80"/>
    <path d="M660 1130h240"/>
  </g>
  <g fill="#000">
    <circle cx="1010" cy="470" r="48"/>
    <circle cx="1050" cy="635" r="48"/>
    <circle cx="1080" cy="800" r="48"/>
    <circle cx="1030" cy="1045" r="48"/>
    <circle cx="900" cy="1130" r="48"/>
  </g>

  <!-- L: upright stem and extended base, inset from the canvas edge -->
  <g stroke="#000" stroke-width="32" stroke-linecap="round" fill="none">
    <path d="M1220 470h150"/>
    <path d="M1220 635h150"/>
    <path d="M1220 800h150"/>
    <path d="M1220 965h150"/>
    <path d="M1220 1130h300"/>
  </g>
  <g fill="#000">
    <circle cx="1220" cy="470" r="48"/>
    <circle cx="1220" cy="635" r="48"/>
    <circle cx="1220" cy="800" r="48"/>
    <circle cx="1220" cy="965" r="48"/>
    <circle cx="1520" cy="1130" r="48"/>
  </g>
</svg>
