# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# Development-only OIDC app for cql-studio-server BFF SSO.
# Secrets are intentionally hardcoded and checked in — localhost use only.
version: 1
metadata:
  name: cql-studio-oidc
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: cql-studio-provider
    state: present
    identifiers:
      name: cql-studio-provider
    attrs:
      name: cql-studio-provider
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: cql-studio-development
      client_secret: cql-studio-development-secret
      grant_types:
        - authorization_code
        - refresh_token
      include_claims_in_id_token: true
      issuer_mode: per_provider
      sub_mode: user_email
      redirect_uris:
        - matching_mode: strict
          url: http://localhost:3003/api/auth/callback
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]

  - model: authentik_core.application
    id: cql-studio-application
    state: present
    identifiers:
      slug: cql-studio
    attrs:
      name: CQL Studio
      slug: cql-studio
      policy_engine_mode: any
      provider: !KeyOf cql-studio-provider

  - model: authentik_core.group
    id: cql-studio-admins
    state: present
    identifiers:
      name: CQL Studio Admins
    attrs:
      name: CQL Studio Admins
      is_superuser: true

  - model: authentik_core.user
    id: cql-studio-administrator
    state: present
    identifiers:
      username: administrator
    attrs:
      username: administrator
      name: Administrator
      email: administrator@localhost
      password: password
      path: users
      is_active: true
      groups:
        - !KeyOf cql-studio-admins

  - model: authentik_core.user
    id: cql-studio-developer
    state: present
    identifiers:
      username: developer
    attrs:
      username: developer
      name: CQL Studio Developer
      email: developer@localhost
      password: developer
      path: users
      is_active: true

  - model: authentik_core.user
    id: cql-studio-alice
    state: present
    identifiers:
      username: alice
    attrs:
      username: alice
      name: Alice
      email: alice@localhost
      password: password
      path: users
      is_active: true

  - model: authentik_core.user
    id: cql-studio-bob
    state: present
    identifiers:
      username: bob
    attrs:
      username: bob
      name: Bob
      email: bob@localhost
      password: password
      path: users
      is_active: true

  - model: authentik_core.user
    id: cql-studio-charlie
    state: present
    identifiers:
      username: charlie
    attrs:
      username: charlie
      name: Charlie
      email: charlie@localhost
      password: password
      path: users
      is_active: true

  - model: authentik_core.user
    id: cql-studio-daniel
    state: present
    identifiers:
      username: daniel
    attrs:
      username: daniel
      name: Daniel
      email: daniel@localhost
      password: password
      path: users
      is_active: true
